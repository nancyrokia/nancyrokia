<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Virtual Chemistry Lab – Litmus Test</title>

<style>
/* ===== RESET ===== */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

/* ===== BODY & BACKGROUND ===== */
body {
  font-family: "Segoe UI", Arial, sans-serif;
  height: 100vh;
  overflow: hidden;
  background: radial-gradient(circle at top, #1f2933, #020617);
  color: #020617;
}

/* animated science glow */
body::before {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(120deg, #1f2933, #93c5fd, #1f2933);
  opacity: 0.35;
  animation: labGlow 16s infinite alternate;
}

@keyframes labGlow {
  from { transform: translateX(-8%); }
  to { transform: translateX(8%); }
}

/* ============ HEADER ============ */
header {
  background: linear-gradient(#1f2933, #334155);
  color: white;
  padding: 14px 22px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  box-shadow: 0 6px 16px rgba(0,0,0,0.4);
  position: relative;
  z-index: 5;
}

.nav-btn {
  padding: 10px 18px;
  font-size: 14px;
  border: none;
  background: linear-gradient(#1f2933, #93c5fd);
  color: white;
  border-radius: 10px;
  cursor: pointer;
  box-shadow: inset 0 0 8px rgba(255,255,255,0.2);
}

.nav-btn:hover {
  transform: translateY(-2px);
}

/* ===== LAYOUT ===== */
.lab {
  position: relative;
  z-index: 2;
  display: grid;
  grid-template-columns: 22% 56% 22%;
  height: calc(100vh - 60px);
}

/* ===== MATERIAL SHELF ===== */
.shelf {
  background: rgba(255,255,255,0.95);
  border-right: 3px solid #cbd5e1;
  padding: 16px;
  overflow-y: auto;
}

.shelf h3 {
  margin-bottom: 12px;
}

.shelf-block {
  background: linear-gradient(#1f2933, #93c5fd);
  color: #ffff;
  border-radius: 14px;
  padding: 12px;
  margin-bottom: 16px;
  box-shadow: inset 0 0 8px rgba(255,255,255,0.5),
              0 8px 18px rgba(0,0,0,0.2);
}

/* ===== RACK ===== */
.rack {
  display: flex;
  justify-content: space-around;
  margin-top: 8px;
}

.rack-tube {
  width: 42px;
  height: 150px;
  border: 2px solid #1f2933;
  border-radius: 0 0 18px 18px;
  background: rgba(255,255,255,0.9);
  cursor: grab;
  box-shadow: inset 0 0 10px rgba(0,0,0,0.15),
              0 6px 14px rgba(0,0,0,0.25);
}

/* ===== TEST TUBE HOLDER ===== */
.test-tube-holder {
  margin-top: 12px;
  padding: 14px;
  background: linear-gradient(#334155, #1f2933);
  border-radius: 14px;
  box-shadow:
    inset 0 4px 8px rgba(255,255,255,0.15),
    0 10px 24px rgba(0,0,0,0.5);
}

/* Rack top plate */
.holder-top {
  height: 18px;
  background: linear-gradient(#1f2933, #93c5fd);
  border-radius: 10px;
  display: flex;
  justify-content: space-around;
  align-items: center;
  margin-bottom: 8px;
}

/* Holes */
.holder-hole {
  width: 40px;
  height: 8px;
  background:#0c0d0e;
  border-radius: 50%;
  box-shadow: inset 0 2px 4px rgba(255,255,255,0.15);
}

/* Rack bottom */
.holder-base {
  height: 16px;
  background: linear-gradient(#1f2933, #93c5fd);
  border-radius: 8px;
  margin-top: 1px;
}

/* Test tubes inside holder */
.holder-tubes {
  display: flex;
  justify-content: space-around;
  align-items: flex-start;
  margin-top: -7px;
}

.holder-tube {
  width: 42px;
  height: 140px;
  border: 2px solid #1f2933;
  border-radius: 0 0 18px 18px;
  background: rgba(255,255,255,0.9);
  cursor: grab;
  box-shadow:
    inset 0 0 8px rgba(0,0,0,0.2),
    0 6px 14px rgba(0,0,0,0.35);
}


/* ===== BEAKER ===== */
.beaker {
  width: 130px;
  height: 170px;
  border: 3px solid #1f2933;
  border-radius: 0 0 32px 32px;
  background: rgba(255,255,255,0.9);
  margin: auto;
  padding: 6px;
  cursor: grab;
  position: relative;
  box-shadow: inset 0 0 14px rgba(0,0,0,0.2),
              0 10px 22px rgba(0,0,0,0.35);
}

.beaker-liquid {
  position: absolute;
  bottom: 6px;
  left: 6px;
  right: 6px;
  height: 70%;
  border-radius: 0 0 24px 24px;
  background: #c6cfd8
}

.beaker select {
  width: 100%;
  margin-top: 6px;
  border-radius: 8px;
  padding: 4px;
}

/* ===== LITMUS ===== */
.litmus-container {
  display: flex;
  justify-content: space-around;
  margin-top: 10px;
}

.litmus-strip {
  width: 14px;
  height: 90px;
  border-radius: 6px;
  cursor: grab;
  box-shadow: 0 4px 10px rgba(0,0,0,0.3);
}

.blue-litmus { background: #2563eb; }
.red-litmus { background: #dc2626; }

/* ===== WORKSPACE ===== */
.workspace {
  display: flex;
  flex-direction: column;
}

.wall-shelf {
  background: linear-gradient(#93c5fd, #1f2933);
  color: white;
  padding: 12px;
  text-align: center;
  font-weight: bold;
  box-shadow: inset 0 -4px 10px rgba(0,0,0,0.4);
}

.bench-area {
  flex: 1;
  background: linear-gradient(#1f2933, #93c5fd);
  padding: 20px;
  display: flex;
  justify-content: center;
  align-items: flex-end;
}

.bench {
  background: linear-gradient(#1f2933, #93c5fd);
  width: 90%;
  height: 85%;
  border-radius: 20px;
  padding: 20px;
  display: flex;
  gap: 40px;
  align-items: flex-end;
  transform: translateY(-60px);
  box-shadow: inset 0 0 30px rgba(255,255,255,0.12),
              0 30px 60px rgba(0,0,0,0.6);
}

/* ===== TEST TUBE ===== */
.test-tube {
  width: 72px;
  height: 250px;
  border: 3px solid #1f2933;
  border-radius: 0 0 30px 30px;
  background: rgba(255,255,255,0.9);
  position: relative;
  box-shadow: inset 0 0 14px rgba(0,0,0,0.2),
              0 10px 20px rgba(0,0,0,0.4);
}

.test-tube {
  background: linear-gradient(
    to right,
    rgba(255,255,255,0.25),
    rgba(255,255,255,0.05),
    rgba(255,255,255,0.25)
  );
}


.tube-label {
  position: absolute;
  top: -120px;
  width: 100%;
  text-align: center;
  font-size: 12px;
  font-weight: bold;
  color: #fff;
}

.liquid {
  position: absolute;
  bottom: 0;
  width: 100%;
  height: 70%;
  border-radius: 0 0 26px 26px;
  background: transparent;
}

/* ===== LITMUS INSIDE TUBE ===== */
.inserted-litmus {
  position: absolute;
  top: -40px;
  left: 50%;
  transform: translateX(-50%);
  width: 10px;
  height: 140px;
}

.litmus-top,
.litmus-bottom {
  width: 100%;
  height: 50%;
}

/* ===== GUIDE ===== */
.guide {
  background: rgba(255,255,255,0.97);
  padding: 16px;
  border-left: 3px solid #cbd5e1;
  overflow-y: auto;
}

.feedback {
  margin-top: 10px;
  font-weight: bold;
  color: #1f2933;
}

.analysis {
  margin-top: 15px;
  padding: 10px;
  background: #f1f5f9;
  border-radius: 10px;
}
/* ===== GREEN CHECKED CHECKBOXES ===== */
.checklist label {
  display: block;
  margin-bottom: 6px;
}

.checklist input[type="checkbox"] {
  accent-color: #16a34a; /* modern browsers */
  transform: scale(1.2);
  margin-right: 6px;
}

/* Make label text green when checked */
.checklist input[type="checkbox"]:checked + span {
  color: #16a34a;
  font-weight: bold;
}


/* ===== TABLE ===== */
table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 10px;
  font-size: 13px;
}

th, td {
  border: 1px solid #cbd5e1;
  padding: 6px;
  text-align: center;
}

th {
  background: #e5e7eb;
}

/* Inserting litmus paper and removal */
.inserted-litmus {
  cursor: pointer;
}

/* small hover hint */
.inserted-litmus:hover {
  filter: brightness(1.2);
}


/* ===== ANIMATION BOX ===== */
.animation-box {
  margin-top: 15px;
  background: linear-gradient(#1f2933, #93c5fd);
  color:#ffff;
  border-radius: 12px;
  padding: 10px;
  text-align: center;
}

/* ===== ANIMATED PROCEDURE VISUAL ===== */
.anim-wrapper {
  position: relative;
  height: 160px;
  margin-top: 10px;
}

/* animated test tube */
.anim-tube {
  width: 40px;
  height: 120px;
  border: 3px solid #1f2933;
  border-radius: 0 0 18px 18px;
  position: absolute;
  left: 50%;
  bottom: 0;
  transform: translateX(-50%);
  background: white;
  overflow: hidden;
}

/* liquid inside tube */
.anim-liquid {
  position: absolute;
  bottom: 0;
  width: 100%;
  height: 50%;
  background: #93c5fd;
}

/* litmus strip */
.anim-litmus {
  width: 10px;
  height: 90px;
  background: #dc2626 50%;
  position: absolute;
  left: 50%;
  top: 0;
  transform: translateX(-50%);
  animation: dipLitmus 3s infinite;
}

/* dipping animation */
@keyframes dipLitmus {
  0%   { top: 0; }
  40%  { top: 60px; }
  60%  { top: 60px; }
  100% { top: 0; }
}


/* ===== VIDEO ===== */
.quick-video iframe {
  width: 100%;
  height: 160px;
  border-radius: 12px;
  border: none;
}

/* ===== NAV BUTTONS ===== */
button {
  padding: 12px 20px;
  font-size: 16px;
  border: none;
  border-radius: 12px;
  cursor: pointer;
  background: linear-gradient(#1f2933, #93c5fd);
  color: white;
  box-shadow: 0 8px 20px rgba(0,0,0,0.4);
}
/* Reset button */
.bench {
  position: relative; /* 🔑 anchor for absolute positioning */
}

/* Reset button inside bench */
.bench-reset {
  position: absolute;
  top: 120px;
  right: 400px;
  padding: 8px 14px;
  font-size: 14px;
  border-radius: 10px;
  background: linear-gradient(#1f2933, #93c5fd);
  color: white;
  border: none;
  cursor: pointer;
  box-shadow: 0 6px 16px rgba(0,0,0,0.4);
  z-index: 10;
}

.bench-reset:hover {
  transform: translateY(-2px) scale(1.05);
}

/* ===== REAL TRASH CAN ===== */
.trash-can {
  position: absolute;
  bottom: 100px;
  right: 400px;
  width: 90px;
  cursor: pointer;
  user-select: none;
  z-index: 20;
}

/* Lid */
.trash-lid {
  height: 16px;
  background: linear-gradient(#475569, #1f2933);
  border-radius: 8px 8px 4px 4px;
  margin-bottom: 4px;
  box-shadow: inset 0 -2px 4px rgba(255,255,255,0.2);
}

/* Body */
.trash-body {
  height: 110px;
  background: linear-gradient(#64748b, #334155);
  border-radius: 0 0 16px 16px;
  box-shadow:
    inset 0 6px 10px rgba(255,255,255,0.15),
    inset 0 -8px 12px rgba(0,0,0,0.4),
    0 10px 24px rgba(0,0,0,0.6);
  padding: 8px;
  overflow: hidden;
  display: flex;
  align-items: flex-end;
}

/* Inside container */
.trash-inside {
  display: flex;
  gap: 4px;
  flex-wrap: wrap;
  align-items: flex-end;
}

/* Litmus inside trash can */
.trash-litmus {
  width: 6px;
  height: 28px;
  border-radius: 3px;
  opacity: 0.85;
  box-shadow: inset 0 0 4px rgba(0,0,0,0.4);
}

/* Label */
.trash-label {
  text-align: center;
  font-size: 11px;
  margin-top: 4px;
  color: #ffffff;
  font-weight: bold;
}

/* Drag hover feedback */
.trash-can.drag-over .trash-body {
  background: linear-gradient(#22c55e, #15803d);
}

.holder-tube.empty {
  background: repeating-linear-gradient(
    45deg,
    #94a3b8,
    #94a3b8 6px,
    #cbd5e1 6px,
    #cbd5e1 12px
  );
}

.tube-controls {
  position: absolute;
  top: -40px;
  display: flex;
  gap: 6px;
}

.drain-btn, .wash-btn {
  font-size: 10px;
  padding: 4px 6px;
  border-radius: 6px;
  cursor: pointer;
}

.inserted-litmus {
  position: absolute;
  top: -40px;
  left: 50%;
  transform: translateX(-50%);
}



</style>
</head>

<!-- MATERIALS -->

<div class="test-tube-holder">

<!-- SCRIPT (UNCHANGED) -->
<script>
const bench = document.getElementById("bench");
const solutionSelect = document.getElementById("solution");
const beakerLiquid = document.getElementById("beakerLiquid");
const log = document.getElementById("log");
const feedback = document.getElementById("feedback");

/* 🧠 Solution data */
const solutionData = {
  lemon: { name: "Lemon Juice", type: "acid", color: "#fde68a" },
  vinegar:{ name: "Vinegar", type: "acid", color: "#cbd5e1" },
  hcl:{ name: "Hydrochloric Acid (HCl)", type: "acid", color: "#cbd5e1" },
  soap:{ name: "Soap Solution", type: "base", color: "#bfdbfe" },
  naoh:{ name: "Sodium Hydroxide (NaOH)", type: "base", color: "#cbd5e1" },
  baking:{ name: "Baking Soda", type: "base", color: "#cbd5e1" },
  water:{ name: "Water", type: "neutral", color: "#cbd5e1" },
  salt:{ name: "Salt Solution", type: "neutral", color: "#cbd5e1" }
};

/* Trash */
const trashCan = document.getElementById("trashCan");
const trashInside = document.getElementById("trashInside");

let tubeCount = 0;

/* Beaker colour */
solutionSelect.addEventListener("change", () => {
  const sol = solutionData[solutionSelect.value];
  beakerLiquid.style.background = sol ? sol.color : "#d1d5db";
});

/* Drag start */
document.addEventListener("dragstart", e => {
  if (e.target.dataset.type) {
    e.dataTransfer.setData("type", e.target.dataset.type);
  }

  if (e.target.classList.contains("holder-tube")) {
    e.dataTransfer.setData("type", "tube");
    e.target.classList.add("empty");
    e.target.style.opacity = "0.25";
    e.target.draggable = false;
  }

  if (e.target.classList.contains("inserted-litmus")) {
    e.dataTransfer.setData("trashId", e.target.dataset.trashId);
    e.dataTransfer.setData(
      "color",
      e.target.querySelector(".litmus-bottom").style.background
    );
  }
});

/* Bench drop */
bench.addEventListener("dragover", e => e.preventDefault());

bench.addEventListener("drop", e => {
  if (e.dataTransfer.getData("type") === "tube") {
    tubeCount++;

    const tube = document.createElement("div");
    tube.className = "test-tube";
    tube.dataset.label = `Tube ${tubeCount}`;
    tube.dataset.solution = "";
    tube.dataset.solutionType = "";

    tube.innerHTML = `
      <div class="tube-label">${tube.dataset.label}</div>
      <div class="liquid"></div>
    `;

    bench.appendChild(tube);
    document.getElementById("s1").checked = true;
    enableTube(tube);
  }
});

function enableTube(tube) {
  tube.addEventListener("dragover", e => e.preventDefault());

  tube.addEventListener("drop", e => {
    const type = e.dataTransfer.getData("type");

    /* Pour solution */
    if (type === "beaker") {
      const sol = solutionData[solutionSelect.value];
      if (!sol) return;

      tube.dataset.solution = sol.name;
      tube.dataset.solutionType = sol.type;

      tube.querySelector(".liquid").style.background = sol.color;
      tube.querySelector(".tube-label").textContent =
        `${tube.dataset.label} (${sol.name})`;

      document.getElementById("s2").checked = true;
      feedback.textContent = "Solution added to test tube.";
    }

    /* Insert litmus (ALLOW TWO) */
    if (type.includes("litmus")) {
      if (!tube.dataset.solution) {
        feedback.textContent = "Add a solution before testing.";
        return;
      }

      const existing = tube.querySelectorAll(".inserted-litmus");
      if (existing.length >= 2) {
        feedback.textContent = "Only two litmus papers allowed per test tube.";
        return;
      }

      const order = existing.length + 1;
      const rowId = `${tube.dataset.label}-litmus-${order}-${Date.now()}`;

      const strip = document.createElement("div");
      strip.className = "inserted-litmus";
      strip.draggable = true;
      strip.dataset.trashId = rowId;
      strip.dataset.order = order;
      strip.style.left = order === 1 ? "35%" : "65%";
strip.style.transform = "translateX(-50%)";


      strip.innerHTML = `
        <div class="litmus-top"></div>
        <div class="litmus-bottom"></div>
      `;

      tube.appendChild(strip);

      const top = strip.querySelector(".litmus-top");
      const bottom = strip.querySelector(".litmus-bottom");

      top.style.background =
        type === "blue-litmus" ? "#2563eb" : "#dc2626";

      const solType = tube.dataset.solutionType;
      bottom.style.background =
        solType === "acid" ? "#dc2626" :
        solType === "base" ? "#2563eb" :
        top.style.background;

      log.innerHTML += `
        <tr id="${rowId}">
          <td>${tube.dataset.label}</td>
          <td>${tube.dataset.solution}</td>
          <td>Litmus ${order} (${type.replace("-", " ")})</td>
          <td>Colour change observed</td>
          <td>
            Compared with Litmus ${order === 1 ? 2 : 1}<br>
            Result matches ${tube.dataset.solutionType.toUpperCase()}
          </td>
        </tr>
      `;

      document.getElementById("s3").checked = true;
      document.getElementById("s4").checked = true;
      feedback.textContent = `Litmus ${order} tested successfully.`;
    }
  });
}

/* Trash */
trashCan.addEventListener("dragover", e => {
  e.preventDefault();
  trashCan.classList.add("drag-over");
});

trashCan.addEventListener("dragleave", () =>
  trashCan.classList.remove("drag-over")
);

trashCan.addEventListener("drop", e => {
  e.preventDefault();
  trashCan.classList.remove("drag-over");

  const rowId = e.dataTransfer.getData("trashId");
  const color = e.dataTransfer.getData("color");

  document.querySelector(`[data-trash-id="${rowId}"]`)?.remove();
  document.getElementById(rowId)?.remove();

  const trashStrip = document.createElement("div");
  trashStrip.className = "trash-litmus";
  trashStrip.style.background = color;
  trashInside.appendChild(trashStrip);

  feedback.textContent = "Litmus discarded.";
});

trashCan.addEventListener("click", () => {
  trashInside.innerHTML = "";
  feedback.textContent = "Trash can emptied.";
});

/* Reset */
function resetBench() {
  bench.innerHTML = "";
  log.innerHTML = "";
  tubeCount = 0;

  ["s1","s2","s3","s4"].forEach(id =>
    document.getElementById(id).checked = false
  );

  solutionSelect.value = "";
  beakerLiquid.style.background = "#d1d5db";

  document.querySelectorAll(".holder-tube").forEach(tube => {
    tube.classList.remove("empty");
    tube.style.opacity = "1";
    tube.draggable = true;
  });

  feedback.textContent = "Workbench reset.";
}
</script>
