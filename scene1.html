<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Scene 1 – Preparing Acid–Base Indicator</title>

<style>
/* ============ RESET ============ */
* { margin: 0; padding: 0; box-sizing: border-box; }

/* ============ BODY & ATMOSPHERE ============ */
body {
  font-family: "Segoe UI", Arial, sans-serif;
  background: radial-gradient(circle at top, #334155, #1f2933);
  color: #0f172a;
  height: 100vh;
  overflow: hidden;
}

/* moving lab light */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  background: linear-gradient(
    120deg,
    rgba(147,197,253,0.15),
    rgba(31,41,51,0.7),
    rgba(147,197,253,0.15)
  );
  animation: labGlow 16s infinite alternate;
  pointer-events: none;
}

@keyframes labGlow {
  from { transform: translateX(-15%); }
  to { transform: translateX(15%); }
}

/* floating chemistry ions */
.ion {
  position: fixed;
  font-weight: bold;
  font-size: 15px;
  opacity: 0.25;
  animation: floatIon 12s infinite ease-in-out;
  pointer-events: none;
}

@keyframes floatIon {
  50% { transform: translateY(-40px); }
}

.h { color: #93c5fd; }
.oh { color: #bfdbfe; }

.i1 { top: 18%; left: 15%; }
.i2 { top: 65%; left: 30%; animation-delay: 3s; }
.i3 { top: 25%; right: 20%; animation-delay: 6s; }
.i4 { bottom: 20%; right: 30%; animation-delay: 9s; }

/* ============ HEADER ============ */
header {
  background: linear-gradient(#1f2933, #334155);
  color: white;
  padding: 14px 22px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  box-shadow: 0 6px 16px rgba(0,0,0,0.4);
  position: relative;
  z-index: 5;
}

.nav-btn {
  padding: 10px 18px;
  font-size: 14px;
  border: none;
  background: linear-gradient(#1f2933, #93c5fd);
  color: white;
  border-radius: 10px;
  cursor: pointer;
  box-shadow: inset 0 0 8px rgba(255,255,255,0.2);
}

.nav-btn:hover {
  transform: translateY(-2px);
}

/* ============ LAYOUT ============ */
.lab {
  display: grid;
  grid-template-columns: 20% 56% 24%;
  height: calc(100vh - 60px);
  gap: 10px;
}

/* ============ MATERIAL SHELF ============ */
.shelf {
  background: linear-gradient(#f8fafc, #e5e7eb);
  border-right: 3px solid #cbd5e1;
  padding: 10px;
  overflow-y: auto;
  text-align: center;
}

.item {
  width: 70px;
  margin: 14px auto;
  cursor: grab;
  font-size: 12px;
}

/* icons */
.cabbage-item {
  width: 50px; height: 50px;
  background: radial-gradient(circle at 30% 30%, #7c2d12, #4b0000);
  border-radius: 50%;
}
.pestle-item {
  width: 14px; height: 80px;
  background: linear-gradient(#9ca3af, #64748b);
  border-radius: 8px;
}
.stirrer-item {
  width: 6px; height: 80px;
  background: #334155;
}
.water-beaker-item {
  width: 50px; height: 70px;
  border: 2px solid #1f2933;
  position: relative;
}
.water-beaker-item::after {
  content: "";
  position: absolute;
  bottom: 0;
  height: 60%;
  width: 100%;
  background: #93c5fd;
}
.funnel-item {
  width: 0; height: 0;
  border-left: 20px solid transparent;
  border-right: 20px solid transparent;
  border-top: 35px solid #cbd5e1;
}

/* ============ WORKSPACE ============ */
.workspace {
  display: flex;
  justify-content: center;
  align-items: flex-end;
}

.bench {
  width: 92%;
  height: 82%;
  background: linear-gradient(#1f2933, #475569);
  border-radius: 20px;
  padding: 20px;
  display: flex;
  gap: 60px;
  justify-content: center;
  align-items: flex-end;
  transform: translateY(-50px);
  box-shadow: inset 0 0 25px rgba(147,197,253,0.15);
}

/* mortar & beaker */
.mortar {
  width: 120px;
  height: 70px;
  background: #d1d5db;
  border-radius: 0 0 60px 60px;
  position: relative;
}

.cabbage {
  width: 50px; height: 50px;
  background: #7c2d12;
  border-radius: 50%;
  position: absolute;
  bottom: 5px;
  left: 50%;
  transform: translateX(-50%);
}
.cabbage.crushed {
  width: 80px; height: 25px;
  background: #6d28d9;
  border-radius: 15px;
}

.pestle {
  width: 14px;
  height: 70px;
  background: #64748b;
  position: absolute;
  top: -70px;
  left: 55px;
  border-radius: 8px;
  animation: crush 0.8s infinite;
}
@keyframes crush { 50% { top: -35px; } }

.water-stream {
  width: 4px;
  height: 60px;
  background: #93c5fd;
  position: absolute;
  top: -60px;
  left: 50%;
}

.stirrer {
  width: 4px;
  height: 50px;
  background: #334155;
  position: absolute;
  left: 50%;
  animation: stir 1s linear infinite;
}
@keyframes stir { to { transform: rotate(360deg); } }

.beaker {
  width: 100px;
  height: 140px;
  border: 2px solid #1f2933;
  background: #f8fafc;
  position: relative;
}

.indicator {
  position: absolute;
  bottom: 0;
  width: 100%;
  height: 70%;
  background: linear-gradient(#a855f7, #6d28d9);
}

/* ============ GUIDE ============ */
.guide {
  background: white;
  padding: 12px;
  border-left: 3px solid #cbd5e1;
  height: 100%;
}

.checklist label {
  display: block;
  margin-bottom: 8px;
}
.checklist input:checked + span {
  color: #16a34a;
  font-weight: bold;
}

.feedback { font-weight: bold; margin-top: 10px; }
.warning { color: red; font-weight: bold; }

/* ============ END ============ */
</style>
</head>

<body>

<!-- floating ions -->
<div class="ion h i1">H⁺</div>
<div class="ion oh i2">OH⁻</div>
<div class="ion h i3">H⁺</div>
<div class="ion oh i4">OH⁻</div>

<header>
  <h2>🧪 Scene 1 – Preparing Acid–Base Indicator</h2>
  <div>
    <button class="nav-btn" onclick="location.href='index.html'">◀ Home</button>
    <button class="nav-btn" onclick="location.href='scene2.html'">Next ▶</button>
  </div>
</header>

<div class="lab">

<aside class="shelf">
  <h3>🧰 Materials</h3>
  <div class="item" draggable data-type="cabbage"><div class="cabbage-item"></div>Red Cabbage</div>
  <div class="item" draggable data-type="pestle"><div class="pestle-item"></div>Pestle</div>
  <div class="item" draggable data-type="water"><div class="water-beaker-item"></div>Warm Water</div>
  <div class="item" draggable data-type="stir"><div class="stirrer-item"></div>Stirrer</div>
  <div class="item" draggable data-type="filter"><div class="funnel-item"></div>Filter Funnel</div>
</aside>

<main class="workspace">
  <div class="bench">
    <div class="mortar" id="mortar"></div>
    <div class="beaker" id="beaker"></div>
  </div>
</main>

<aside class="guide">
  <h3>🧪 Procedure</h3>
  <div class="checklist">
    <label><input type="checkbox" id="step1" disabled><span>Add cabbage</span></label>
    <label><input type="checkbox" id="step2" disabled><span>Crush</span></label>
    <label><input type="checkbox" id="step3" disabled><span>Add water</span></label>
    <label><input type="checkbox" id="step4" disabled><span>Stir</span></label>
    <label><input type="checkbox" id="step5" disabled><span>Filter</span></label>
  </div>
  <p class="feedback" id="feedback">Drag the red cabbage into the mortar.</p>
  <p class="warning" id="warning"></p>
</aside>

</div>

<script>
let step = 0;
const mortar = document.getElementById("mortar");
const beaker = document.getElementById("beaker");
const feedback = document.getElementById("feedback");
const warning = document.getElementById("warning");

document.addEventListener("dragstart", e => {
  if (e.target.closest(".item")) {
    e.dataTransfer.setData("type", e.target.closest(".item").dataset.type);
  }
});

[mortar, beaker].forEach(el =>
  el.addEventListener("dragover", e => e.preventDefault())
);

mortar.addEventListener("drop", e => {
  const t = e.dataTransfer.getData("type");
  warning.textContent = "";

  if (t === "cabbage" && step === 0) {
    mortar.innerHTML += `<div class="cabbage" id="cab"></div>`;
    step++; document.getElementById("step1").checked = true;
    feedback.textContent = "Cabbage added.";
  } else if (t === "pestle" && step === 1) {
    document.getElementById("cab").classList.add("crushed");
    mortar.innerHTML += `<div class="pestle"></div>`;
    step++; document.getElementById("step2").checked = true;
    feedback.textContent = "Pigment released.";
  } else if (t === "water" && step === 2) {
    mortar.innerHTML += `<div class="water-stream"></div>`;
    step++; document.getElementById("step3").checked = true;
    feedback.textContent = "Extraction started.";
  } else if (t === "stir" && step === 3) {
    mortar.innerHTML += `<div class="stirrer"></div>`;
    step++; document.getElementById("step4").checked = true;
    feedback.textContent = "Stirring complete.";
  } else warning.textContent = "Follow the correct order.";
});

beaker.addEventListener("drop", e => {
  if (e.dataTransfer.getData("type") === "filter" && step === 4) {
    beaker.innerHTML = `<div class="indicator"></div>`;
    document.getElementById("step5").checked = true;
    feedback.textContent = "Indicator ready for testing!";
    step++;
  } else warning.textContent = "Complete previous steps first.";
});
</script>

</body>
</html>
